name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - name: go vet
        run: go vet ./...
        working-directory: src
      - name: go test
        run: go test ./...
        working-directory: src
      - name: Build CLI (linux-amd64)
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o ../build/llvm-configure-linux-amd64 ./cmd/llvm-configure
        working-directory: src
      - name: Upload artifact (llvm-configure-linux-amd64)
        uses: actions/upload-artifact@v4
        with:
          name: llvm-configure-linux-amd64
          path: build/llvm-configure-linux-amd64
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64 (Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - name: Assert runner architecture
        run: |
          echo "uname -m: $(uname -m)"
          test "$(uname -m)" = "arm64"
      - name: go vet
        run: go vet ./...
        working-directory: src
      - name: go test
        run: go test ./...
        working-directory: src
      - name: Build CLI (darwin-arm64)
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o ../build/llvm-configure-darwin-arm64 ./cmd/llvm-configure
        working-directory: src
      - name: Integration smoke test (native, Homebrew discovery)
        run: |
          ./scripts/darwin_smoke_test.sh build/llvm-configure-darwin-arm64 arm64
      - name: Upload artifact (llvm-configure-darwin-arm64)
        uses: actions/upload-artifact@v4
        with:
          name: llvm-configure-darwin-arm64
          path: build/llvm-configure-darwin-arm64
          if-no-files-found: error

  macos-x86_64:
    name: macOS x86_64 (Intel)
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
      - name: Assert runner architecture
        run: |
          echo "uname -m: $(uname -m)"
          test "$(uname -m)" = "x86_64"
      - name: go vet
        run: go vet ./...
        working-directory: src
      - name: go test
        run: go test ./...
        working-directory: src
      - name: Build CLI (darwin-amd64)
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o ../build/llvm-configure-darwin-amd64 ./cmd/llvm-configure
        working-directory: src
      - name: Integration smoke test (native, Homebrew discovery)
        run: |
          ./scripts/darwin_smoke_test.sh build/llvm-configure-darwin-amd64 x86_64
      - name: Upload artifact (llvm-configure-darwin-amd64)
        uses: actions/upload-artifact@v4
        with:
          name: llvm-configure-darwin-amd64
          path: build/llvm-configure-darwin-amd64
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [linux, macos-arm64, macos-x86_64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v4
        with:
          path: build
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: build/llvm-configure-*
          generate_release_notes: true

# Optional self-hosted fallback: if public Apple Silicon (macos-14) or
# Intel (macos-13) capacity is unavailable, register a self-hosted runner
# and duplicate the matching job above with `runs-on: [self-hosted, macos]`.
# Keep the explicit `uname -m` assertion so a mislabeled runner cannot
# produce false architecture coverage.